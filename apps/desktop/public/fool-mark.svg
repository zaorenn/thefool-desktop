<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="The Fool">
  <!--
    The Fool — marka işareti.

    Tasarım notu: 0 numaralı arkana (The Fool) başlangıcı, sıçrayışı ve
    açık uçlu olasılığı temsil eder. İşaret iki öğeye indirgendi:
      • ✦  skin'deki spinner glifiyle aynı dört uçlu yıldız
      • ——  altındaki kesik çizgi: adım atılan uçurum kenarı

    Renkler skin ve masaüstü temasıyla aynı crimson ailesinden
    (#D01A3F / #E8365A / krem #F2E9EC). 48-64 px'te okunur kalması için
    ince detay yok.
  -->
  <defs>
    <linearGradient id="foolField" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8365A" />
      <stop offset="100%" stop-color="#A8122F" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#foolField)" />

  <!-- Dört uçlu yıldız: sıçrayış anı. -->
  <path
    d="M32 13 C33.4 22.6 39.4 28.6 49 30 C39.4 31.4 33.4 37.4 32 47 C30.6 37.4 24.6 31.4 15 30 C24.6 28.6 30.6 22.6 32 13 Z"
    fill="#F7EDF0" />

  <!-- Uçurum kenarı: çizgi biter, yol bitmez. -->
  <path d="M14 51 H36" stroke="#F7EDF0" stroke-width="3.5" stroke-linecap="round" opacity="0.92" />
  <circle cx="45" cy="51" r="2.1" fill="#F7EDF0" opacity="0.55" />
</svg>
